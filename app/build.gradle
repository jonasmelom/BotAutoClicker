plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.botautoclicker'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.botautoclicker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    } // <- Verifique se todas as chaves do bloco android foram fechadas!

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
} // <- Certifique-se de que o bloco android fecha aqui antes do dependencies

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ...
}
